services:
  - type: web
    name: ascend-nit-rourkela
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run db:setup && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PGLITE_DIR
        value: /tmp/ascend-pglite
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: AUTH_CHANNEL
        value: email
      - key: OTP_PROVIDER
        value: sandbox
      - key: APP_TIMEZONE
        value: Asia/Kolkata
